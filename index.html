<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1a2030}
#map{position:absolute;top:0;left:300px;right:0;bottom:0}
#sidebar{position:absolute;top:0;left:0;width:300px;height:100vh;background:#1a2030;color:#e0e4f0;z-index:1000;display:flex;flex-direction:column;overflow:hidden;box-shadow:2px 0 12px rgba(0,0,0,0.4)}
#sbh{background:#0f1520;padding:14px 16px 10px;border-bottom:1px solid #2a3550;flex-shrink:0}
#sbh h1{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
#sbh p{font-size:10px;color:#6878a0;margin-top:3px}
#sbb{flex:1;overflow-y:auto;padding:4px 0}
#sbb::-webkit-scrollbar{width:4px}
#sbb::-webkit-scrollbar-thumb{background:#2a3550;border-radius:2px}
.gh{padding:8px 14px 6px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#2aa68f;border-top:1px solid #2a3550;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.gh:first-child{border-top:none}
.gb{padding-bottom:3px}
.li{display:flex;align-items:center;gap:8px;padding:3px 14px 3px 22px;cursor:pointer;transition:background .15s}
.li:hover{background:rgba(255,255,255,0.04)}
.li input{width:13px;height:13px;accent-color:#2aa68f;cursor:pointer;flex-shrink:0}
.sw{width:14px;height:14px;border-radius:2px;flex-shrink:0;border:1px solid rgba(255,255,255,0.1)}
.sw.c{border-radius:50%}
.li label{font-size:11px;color:#b0bcd8;line-height:1.3;cursor:pointer}
.li label.b{font-weight:700;color:#fff}
.li label.s{color:#7a85a0;font-style:italic}
#sbf{padding:10px 14px;border-top:1px solid #2a3550;display:flex;align-items:center;gap:10px;background:#0f1520;flex-shrink:0}
#sbf img{height:26px;object-fit:contain}
.sp{width:1px;height:26px;background:#2a3550}
#ldr{position:absolute;top:50%;left:calc(150px + 50%);transform:translate(-50%,-50%);background:rgba(15,21,32,0.97);color:#fff;padding:18px 32px;border-radius:10px;z-index:9999;font-size:12px;text-align:center;border:1px solid #2a3550;min-width:240px}
#ldr h3{font-size:14px;margin-bottom:8px;color:#2aa68f}
#ldrb{width:200px;height:5px;background:#2a3550;border-radius:3px;margin:10px auto 0;overflow:hidden}
#ldrf{height:100%;background:#2aa68f;border-radius:3px;width:0%;transition:width .4s}
#ldrt{font-size:10px;color:#6878a0;margin-top:6px}
.pop h3{font-size:13px;font-weight:700;color:#1a2030;margin-bottom:5px;line-height:1.3}
.pop p{font-size:11px;color:#3d4557;margin:2px 0;line-height:1.45}
.pop a{color:#1a7f6e;font-size:11px}
.bsp{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.tspa{background:#fff3e8;color:#b06b0a}
.tass{background:#e4eef8;color:#1a4f8a}
.grp-label{padding:4px 14px 2px 22px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#4a5a80}
.leaflet-tooltip{font-size:11px;padding:3px 7px;border:none;border-radius:4px}
.note{font-size:10px;color:#4a5a80;padding:3px 14px 3px 22px;line-height:1.4;font-style:italic}
</style>
</head>

  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ══════════════════════════════════════════════════════
// CARTE
// ══════════════════════════════════════════════════════
const map = L.map('map',{center:[48.2,-4.0],zoom:9,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);

const BASES = {
  'OSM Standard': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),
  'Satellite':    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19}),
  'Terrain':      L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'© OpenTopoMap',maxZoom:17})
};
BASES['OSM Standard'].addTo(map);
L.control.layers(BASES,{},{position:'topright'}).addTo(map);

// ══════════════════════════════════════════════════════
// DÉFINITION DES COUCHES
// ══════════════════════════════════════════════════════
const GROUPS = [
  {
    g: 'Établissements', items: [
      {id:'refuges', label:'Refuges Finistère', color:'#1a4f8a', sw:'c', vis:true, bold:true,
        src:'refuges.geojson', r:'pt', rc:'#1a4f8a', rs:9},
    ]
  },
  {
    g: "Zone d'influence autour des refuges", items: [
      {id:'z5km',  label:'Zone d'influence 5km',  color:'#e8d040', sw:'s', vis:false, sub:true,
        src:'zone_influence_5km.geojson', r:'pg', fc:'#e8d040', fo:0.15, sc:'#c0a820', sw2:0},
      {id:'z10km', label:'Zone 10km autour du refuge', color:'#e05020', sw:'s', vis:false,
        src:'zone10km.geojson', r:'pg', fc:'#e05020', fo:0.08, sc:'#e05020', sw2:1.2},
      {id:'z20km', label:'Zone 20km autour du refuge', color:'#e89320', sw:'s', vis:false,
        src:'zone20km.geojson', r:'pg', fc:'#e89320', fo:0.08, sc:'#e89320', sw2:1.2},
      {id:'z40km', label:'Zone 40km autour du refuge', color:'#e8d040', sw:'s', vis:false,
        src:'zone40km.geojson', r:'pg', fc:'#e8d040', fo:0.08, sc:'#e8d040', sw2:1.2},
    ]
  },
  {
    g: "Temps de trajet jusqu'à un refuge", items: [
      {id:'z15',   label:'Zones à moins de 15 min', color:'#2a6e3a', sw:'s', vis:true,
        src:'zones_moins_15min.geojson', r:'pg', fc:'#2a6e3a', fo:0.40, sc:'#2a6e3a', sw2:0},
      {id:'z1530', label:'Zones entre 15 et 30 min', color:'#90c040', sw:'s', vis:true,
        src:'zones_15_30min.geojson', r:'pg', fc:'#90c040', fo:0.40, sc:'#90c040', sw2:0},
      {id:'z3045', label:'Zones entre 30 et 45 min', color:'#e89320', sw:'s', vis:true,
        src:'zones_30_45min.geojson', r:'pg', fc:'#e89320', fo:0.40, sc:'#e89320', sw2:0},
      {id:'z4560', label:'Zones entre 45 et 60 min', color:'#c03830', sw:'s', vis:true,
        src:'zones_45_60min.geojson', r:'pg', fc:'#c03830', fo:0.40, sc:'#c03830', sw2:0},
    ]
  },
  {
    g: 'Zones candidates', items: [
      {id:'zca', label:'Zone candidate accessible 1km RN', color:'#2a8f5a', sw:'s', vis:true, bold:true,
        src:'zone_candid_access.geojson', r:'pg', fc:'#2a8f5a', fo:0.25, sc:'#2a8f5a', sw2:1},
      {id:'zce', label:'Zone candidate avec exclusions bâti/PN', color:'#8f6a2a', sw:'s', vis:false,
        src:'zone_candid_exclu.geojson', r:'pg', fc:'#8f6a2a', fo:0.20, sc:'#8f6a2a', sw2:1},
      {id:'ba200', label:'Bâtiments agricoles >200m² (BD TOPO)', color:'#c03830', sw:'s', vis:false,
        src:'bati_agri_200.geojson', r:'pg', fc:'#c03830', fo:0.75, sc:'#c03830', sw2:0.5, pp:'bati'},
      {id:'brehab', label:'Bâtiments à réhabiliter', color:'#e89320', sw:'s', vis:true, bold:true,
        src:'bati_rehabilit.geojson', r:'pg', fc:'#e89320', fo:0.75, sc:'#e89320', sw2:0.5, pp:'bati'},
    ]
  },
  {
    g: 'Données de population', items: [
      {id:'cpop', label:'Carreaux population 200m (FILOSOFI)', color:'#d4864a', sw:'s', vis:false,
        src:'carreau_pop.geojson', r:'cpop', note:'⚠ Chargement lent (~10 MB)'},
      {id:'dacc', label:'Densité × accessibilité (score)', color:'#c03830', sw:'s', vis:false,
        src:'densite_access.geojson', r:'dacc', note:'⚠ Chargement lent (~17 MB)'},
    ]
  },
];

// ══════════════════════════════════════════════════════
// POPUPS
// ══════════════════════════════════════════════════════
function refugePopup(f,l){
  const p=f.properties;
  const b=p.type==='Société'?'<span class="bsp tspa">SPA</span>':'<span class="bsp tass">Association</span>';
  l.bindPopup(`<div class="pop" style="min-width:220px;max-width:280px">
    ${b}<h3>${p.nom||''}</h3>
    ${p.adresse?`<p>📍 ${p.adresse}</p>`:''}
    ${p.tel?`<p>📞 ${p.tel}</p>`:''}
    ${p.mail?`<p>✉ ${p.mail}</p>`:''}
    ${p.accueil_type?`<p><b>Accueil :</b> ${p.accueil_type}</p>`:''}
    ${p.info?`<p style="margin-top:5px;font-size:10px;color:#6b7491;max-height:80px;overflow:auto">${p.info.substring(0,200)}…</p>`:''}<br>
    ${p.url?`<a href="${p.url}" target="_blank">🔗 Site web</a>`:''}
  </div>`,{maxWidth:300});
}

function batiPopup(f,l){
  const p=f.properties;
  l.bindPopup(`<div class="pop">
    <h3>Bâtiment réhabilitable</h3>
    <p><b>Nature :</b> ${p.NATURE||'N/A'}</p>
    <p><b>Usage :</b> ${p.USAGE1||'N/A'}</p>
    ${p.ETAT?`<p><b>État :</b> ${p.ETAT}</p>`:''}
    ${p.surface?`<p><b>Surface :</b> ${Math.round(p.surface)} m²</p>`:''}
    ${p.HAUTEUR?`<p><b>Hauteur :</b> ${p.HAUTEUR} m</p>`:''}</div>`);
}

// ══════════════════════════════════════════════════════
// RENDUS SPÉCIAUX
// ══════════════════════════════════════════════════════
const SCORE_COLORS = [
  [15,'#2a6e3a'],[30,'#90c040'],[45,'#e8d040'],
  [60,'#e89320'],[90,'#c03830'],[9999,'#8a1820']
];
function scoreColor(mins){
  if(!mins) return '#6b7491';
  for(const [max,col] of SCORE_COLORS){ if(mins<=max) return col; }
  return '#8a1820';
}

function mkLayer(item,data){
  if(item.r==='pt') return L.geoJSON(data,{
    pointToLayer:(f,ll)=>L.circleMarker(ll,{
      radius:item.rs||9, fillColor:item.rc, color:'#fff', weight:2, fillOpacity:1,
      className:'refuge-marker'
    }),
    onEachFeature: refugePopup
  });

  if(item.r==='pg') return L.geoJSON(data,{
    style:()=>(({color:item.sc||item.fc,weight:item.sw2||0.5,
      fillColor:item.fc,fillOpacity:item.fo})),
    onEachFeature: item.pp==='bati'?batiPopup:null
  });

  if(item.r==='cpop') return L.geoJSON(data,{
    style:f=>(({
      color:'none', weight:0,
      fillColor: f.properties.Ind>500?'#4a1010':
                 f.properties.Ind>200?'#c03830':
                 f.properties.Ind>100?'#e05020':
                 f.properties.Ind>50 ?'#e89320':
                 f.properties.Ind>10 ?'#e8c060':'#f8e8c0',
      fillOpacity:0.7
    }))
  });

  if(item.r==='dacc') return L.geoJSON(data,{
    style:f=>(({
      color:'none', weight:0,
      fillColor: scoreColor(f.properties.AA_MINS),
      fillOpacity: Math.min(0.85, 0.3 + (f.properties.Ind||0)/200)
    }))
  });
}

// ══════════════════════════════════════════════════════
// CHARGEMENT
// ══════════════════════════════════════════════════════
const cache={}, layers={};
const visItems = GROUPS.flatMap(g=>g.items.filter(i=>i.vis));
let done=0;

function setLoader(text,pct,detail){
  document.getElementById('ldrf').style.width=pct+'%';
  if(detail) document.getElementById('ldrt').textContent=detail;
}

function fetchGJ(src){
  if(cache[src]) return Promise.resolve(cache[src]);
  return fetch(src).then(r=>{
    if(!r.ok) throw new Error(`${src}: ${r.status}`);
    return r.json();
  }).then(d=>{cache[src]=d;return d;});
}

// Chargement séquentiel pour éviter de tout charger en parallèle
async function loadVisible(){
  for(const item of visItems){
    try{
      const data = await fetchGJ(item.src);
      layers[item.id] = mkLayer(item,data);
      layers[item.id].addTo(map);
      done++;
      setLoader('Chargement...',done/visItems.length*100,`${done} / ${visItems.length} couches`);
    }catch(e){ console.warn('Erreur chargement',item.src,e); done++; }
  }
  document.getElementById('ldr').style.display='none';
  // Zoom sur le Finistère depuis une couche chargée
  const ref = layers['z4560']||layers['z1530']||layers['refuges'];
  if(ref) map.fitBounds(ref.getBounds(),{padding:[20,20]});
}

loadVisible();

// ══════════════════════════════════════════════════════
// PANNEAU COUCHES
// ══════════════════════════════════════════════════════
const panel = document.getElementById('sbb');

GROUPS.forEach((group,gi)=>{
  const hdr=document.createElement('div'); hdr.className='gh';
  const arr=document.createElement('span');
  arr.id='a'+gi; arr.style.cssText='font-size:9px;display:inline-block;transition:transform .2s;color:#4a5a80';
  arr.textContent='▼';
  hdr.appendChild(arr);
  hdr.appendChild(document.createTextNode(group.g));
  panel.appendChild(hdr);

  const body=document.createElement('div'); body.className='gb'; body.id='gb'+gi;

  group.items.forEach(item=>{
    const row=document.createElement('div'); row.className='li';
    const cb=document.createElement('input'); cb.type='checkbox';
    cb.checked=item.vis; cb.id='c'+item.id;

    const sw=document.createElement('div');
    sw.className='sw'+(item.sw==='c'?' c':'');
    sw.style.background=item.color+'55';
    sw.style.borderColor=item.color;

    const lbl=document.createElement('label');
    lbl.htmlFor='c'+item.id;
    if(item.bold) lbl.className='b';
    else if(item.sub) lbl.className='s';
    lbl.textContent=item.label;

    cb.addEventListener('change',function(){
      if(this.checked){
        if(!layers[item.id]){
          const txt=document.getElementById('ldrt');
          if(txt) txt.textContent='Chargement '+item.src+'…';
          document.getElementById('ldr').style.display='block';
          document.getElementById('ldrf').style.width='30%';
          fetchGJ(item.src).then(data=>{
            layers[item.id]=mkLayer(item,data);
            layers[item.id].addTo(map);
            document.getElementById('ldr').style.display='none';
          }).catch(e=>{
            console.warn(e);
            document.getElementById('ldr').style.display='none';
            alert('Erreur chargement: '+item.src);
          });
        } else { layers[item.id].addTo(map); }
      } else {
        if(layers[item.id]) map.removeLayer(layers[item.id]);
      }
    });

    row.appendChild(cb); row.appendChild(sw); row.appendChild(lbl);
    body.appendChild(row);

    if(item.note){
      const n=document.createElement('div'); n.className='note';
      n.textContent=item.note; body.appendChild(n);
    }
  });

  panel.appendChild(body);
  hdr.addEventListener('click',()=>{
    const b=document.getElementById('gb'+gi), a=document.getElementById('a'+gi);
    const open=b.style.display!=='none';
    b.style.display=open?'none':'';
    a.style.transform=open?'rotate(-90deg)':'';
  });
});
</script>
</body>
</html>
